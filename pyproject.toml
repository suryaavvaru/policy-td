[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "policy-td"
version = "0.1.0"
description = "Teacher-distilled runtime intervention policies for frozen small language models."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Surya Teja Avvaru" }
]
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
  "pydantic>=2.0",
  "pyyaml>=6.0",
  "tqdm>=4.66"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
  "mypy>=1.8"
]
plots = [
  "matplotlib>=3.8"
]
models = [
  "torch>=2.1",
  "transformers>=4.40"
]

[project.scripts]
policy-td = "policy_td.cli.main:main"
policy-td-inspect-results = "policy_td.cli.inspect_results:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[project.urls]
Repository = "https://github.com/suryaavvaru/policy-td"

